name: engineering-autopilot
version: 0.1.0
status: repo-owned-source
owner: nexus_ai
language: ja
runtime_install: synced
entrypoint: SKILL.md
description: engineering-brain CLI と docs/registry を使う approval-gated development lifecycle skill。
commands:
  - python -m devbrain route --task "<task>" --json
  - python -m devbrain gate --trigger implementation --json
  - python -m devbrain catalog --domain <domain> --json
  - python -m devbrain finish --json
  - python -m devbrain hooks install --json
  - python -m devbrain closeout --repo . --json
stoplines:
  - push
  - pr_create
  - merge
  - remote_branch_delete
  - local_branch_delete
  - hook_install
  - visibility_change
  - credential_change
  - runtime_install
