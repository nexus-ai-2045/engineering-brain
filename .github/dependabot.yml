version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # nexus-ai-2045 の自前 workflow（preflight-gate など）は固定先を人が上げるので、ここでは上げない。
    ignore:
      - dependency-name: "nexus-ai-2045/*"
