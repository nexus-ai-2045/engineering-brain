name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Install ai-ratchet-gate from Release wheel (URL + SHA-256 固定)
        env:
          AI_RATCHET_GATE_WHEEL_URL: https://github.com/nexus-ai-2045/ai-ratchet-gate/releases/download/v0.2.0/ai_ratchet_gate-0.2.0-py3-none-any.whl
          AI_RATCHET_GATE_WHEEL_SHA256: 95ebac0afbf91e1d4b3634b011680eeae58a85dc32e801b3bcbb7cfc41a0d4a8
        run: |
          set -euo pipefail
          # pip はファイル名から版を読むので、ファイル名は Release と同じにする
          WHEEL_PATH="$RUNNER_TEMP/ai_ratchet_gate-0.2.0-py3-none-any.whl"
          curl -fsSL -o "$WHEEL_PATH" "$AI_RATCHET_GATE_WHEEL_URL"
          echo "${AI_RATCHET_GATE_WHEEL_SHA256}  ${WHEEL_PATH}" | sha256sum -c -
          python -m pip install --no-deps "$WHEEL_PATH"
      - name: Checkout repo-preflight (upstream, no logic copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: 5b7c774deb8e9abcf0fce0c5f39ec1c1f3a894f3 # v0.10.0
          path: .tools/repo-preflight
          persist-credentials: false
      - name: pytest
        run: python -m pytest -q
      - name: compileall
        run: python -m compileall -q engineering_brain tests
      - name: ai-ratchet-gate
        run: ai-ratchet-gate --repo .
      - name: repo-preflight (shadow consistency + readiness evidence)
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          python tools/run_repo_preflight.py --repo . --base-ref "$BASE_REF"
