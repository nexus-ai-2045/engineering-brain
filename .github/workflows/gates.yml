name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Install ai-ratchet-gate from Release wheel
        run: |
          python -m pip install https://github.com/nexus-ai-2045/ai-ratchet-gate/releases/download/v0.1.0/ai_ratchet_gate-0.1.0-py3-none-any.whl
      - name: Checkout repo-preflight (upstream, no logic copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: 44fdece1634d4afb355639ad465375dca5e5c868
          path: .tools/repo-preflight
          persist-credentials: false
      - name: pytest
        run: python -m pytest -q
      - name: compileall
        run: python -m compileall -q engineering_brain tests
      - name: ai-ratchet-gate
        run: ai-ratchet-gate --repo .
      - name: repo-preflight (shadow consistency + readiness evidence)
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          python tools/run_repo_preflight.py --repo . --base-ref "$BASE_REF"
