name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Install ai-ratchet-gate from Release wheel
        run: |
          python -m pip install https://github.com/nexus-ai-2045/ai-ratchet-gate/releases/download/v0.1.0/ai_ratchet_gate-0.1.0-py3-none-any.whl
      - name: Checkout repo-preflight (upstream, no logic copy)
        uses: actions/checkout@v4
        with:
          repository: nexus-ai-2045/repo-preflight
          path: .tools/repo-preflight
      - name: pytest
        run: python -m pytest -q
      - name: compileall
        run: python -m compileall -q engineering_brain tests
      - name: ai-ratchet-gate
        run: ai-ratchet-gate --repo .
      - name: repo-preflight (shadow consistency + readiness evidence)
        run: |
          python .tools/repo-preflight/scripts/consistency_gate.py --repo . --base-ref "origin/${{ github.base_ref || 'main' }}" --json
          python .tools/repo-preflight/scripts/readiness_scan.py --repo . || true
