  - id: x-bcherny-steps-of-ai-adoption-2026-07
    source_lane: x
    source_pointer:
      - "https://x.com/bcherny/status/2077929379661844559 (2026-07-17, thread)"
      - "artifact 'Steps of AI Adoption' (claude.ai) — 描画型で本文未抽出=pointer 参照"
