    observed_problem: 組織の AI 定着が個人依存で頭打ち(1人 10x、残り追随せず)。定着は個人技でなく組織の段階問題
    reusable_rule: >
      AI 定着を step 0(Gated)〜4(AI-native)の ladder で評価。前進は tokens 増でなく
      「次ボトルネック除去 + 次ガードレール構築」の対。骨子(段階名/役割/ボトルネック)は
      一次スレッドに pointer のみ(本文突合は field review 残)。各段の products/guardrails 細部は二次解説由来・一次未突合。
    evidence: "@bcherny 公式スレッド(骨子)+ explainx 二次解説(細部)。骨子・細部とも一次 artifact 本文とは未突合(pointer のみ)"
    freshness: "2026-07-17"
    rights_and_privacy: 投稿本文は保存しない。digest 化。full 表 verbatim は保存せず
    adoption_target: docs
    adopted_doc: docs/BORIS_CHERNY_AI_ADOPTION_AND_CC_TIPS.md
    decision: candidate
    field_review: pending
    review_trigger: "次の tooling/移行レビュー cycle で自環境の step を再判定し advisory unit を回す"
    assurance_gate: ai_adoption_maturity_advisory
    decision_reason: >
      digest doc + assurance unit へ接続済(採用意向は達成)。実地 field review 未実施のため ladder は candidate
      に留める(field review 1回で adopt 昇格)。骨子・細部とも本文突合は field_review 残。運用保証は advisory unit 経由(G1)。

